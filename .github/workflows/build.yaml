name: 🚚 Deploy Web

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-20.04
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Tools & Dependencies
        uses: ./.github/actions/install

      - name: Build
        working-directory: ./web
        run: NODE_ENV=production pnpm run build

      - name: Edgeserver Upload 
        uses: v3xlabs/edgeserver-upload@v0.1.2-pre.4
        with:
          app_id: "289766393082388979"
          server: https://api.edgeserver.io
          token: ${{ secrets.SIGNAL_TOKEN }}
          directory: web/dist

      - name: Edgeserver v0.2 Upload
        uses: v3xlabs/edgeserver-upload@v0.2.1-pre.4
        with:
          site_id: s_fec5326acb
          directory: web/dist
          context: true
          server: https://edgeserver.dev/api
          token: ${{ secrets.EDGE_TOKEN }}

